name: Build Release

# Release tags (one version counter for all of them, docs/release-notes/README.md):
#   vX.Y.Z       every platform: the 3DS CIA and the Wii U WUHB on one release page
#   3ds-vX.Y.Z   the 3DS only
#   wiiu-vX.Y.Z  the Wii U only
# Each console's updater takes the general releases and its own, never the other's
# (platform/3ds/source/port_updater_parse.c, Updater_TagVersion).
on:
  push:
    tags:
      - 'v*'
      - '3ds-v*'
      - 'wiiu-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      channel: ${{ steps.vars.outputs.channel }}
      build_3ds: ${{ steps.vars.outputs.build_3ds }}
      build_wiiu: ${{ steps.vars.outputs.build_wiiu }}
      platforms: ${{ steps.vars.outputs.platforms }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag, platforms and channel
        id: vars
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *)           TAG=$(git describe --tags --always) ;;
          esac
          case "$TAG" in
            3ds-v*)  B3DS=true;  BWIIU=false; PLATFORMS="3DS" ;;
            wiiu-v*) B3DS=false; BWIIU=true;  PLATFORMS="Wii U" ;;
            *)       B3DS=true;  BWIIU=true;  PLATFORMS="3DS + Wii U" ;;
          esac
          VERSION="${TAG#3ds-}"; VERSION="${VERSION#wiiu-}"

          # Stable vs beta is decided by whether main can reach this commit,
          # NOT by "was this a tag push". A release/* branch collects work and
          # may be tagged while still unmerged -- that is a beta; only the
          # merge into main declares the line stable. Consequences:
          #   - Tag on an unmerged release/* branch  -> Beta (prerelease).
          #   - Tag on (or merged into) main         -> Release.
          #   - Manual workflow_dispatch on a branch -> Beta.
          #   - Re-running this workflow ON THE TAG (not on main) for a tag
          #     that already shipped as a beta promotes that same release page
          #     to stable. It has to be the tag: TAG comes from git describe on
          #     a manual run, and main's tip is one merge commit past the tag,
          #     so dispatching on main yields vX.Y.Z-1-g<hash> and would
          #     publish a second page instead of updating the first.
          # Push main BEFORE the tag, otherwise the tag build cannot see the
          # merge yet and publishes as a beta. If the fetch below fails we
          # deliberately fall through to Beta: mislabelling a stable build as
          # a beta is recoverable, the other direction is not.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main 2>/dev/null; then
            PRERELEASE=false; CHANNEL=Release
          else
            PRERELEASE=true; CHANNEL=Beta
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
            echo "build_3ds=$B3DS"
            echo "build_wiiu=$BWIIU"
            echo "platforms=$PLATFORMS"
          } >> "$GITHUB_OUTPUT"

  build-3ds:
    needs: vars
    if: needs.vars.outputs.build_3ds == 'true'
    runs-on: ubuntu-latest
    container:
      # Pinned, not :latest: a new compiler can lay the decompilation out
      # differently, and every save state from the previous release would
      # then be refused ("SLOT DE OTRA BUILD"). Bump deliberately.
      image: devkitpro/devkitarm:20260610
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 3DS portlibs
        run: dkp-pacman -S --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib

      # CHANNEL is baked into the binary (shown as BETA on the console and used by
      # the updater to offer the promoted stable build of the same X.Y.Z). The
      # version comes from the tag (platform/3ds/Makefile drops "3ds-").
      - name: Build 3DS Port (Release)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          chmod +x tools/bin/bannertool tools/bin/makerom
          export PATH=$GITHUB_WORKSPACE/tools/bin:/opt/devkitpro/tools/bin:$PATH
          make -C platform/3ds clean
          make -C platform/3ds -j$(nproc) RENDERER=gpu CHANNEL=${{ needs.vars.outputs.prerelease == 'true' && 'beta' || 'release' }} BANNERTOOL=$GITHUB_WORKSPACE/tools/bin/bannertool MAKEROM=$GITHUB_WORKSPACE/tools/bin/makerom
          cp platform/3ds/mzm-3ds.cia "mzm-3ds-${{ needs.vars.outputs.tag }}.cia"

      - name: Upload the CIA
        uses: actions/upload-artifact@v4
        with:
          name: mzm-3ds
          path: mzm-3ds-${{ needs.vars.outputs.tag }}.cia

  build-wiiu:
    needs: vars
    if: needs.vars.outputs.build_wiiu == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20261102
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # wiiu-curl and wiiu-mbedtls: the updater (platform/pc/source/port_updater_wiiu.c).
      - name: Install Wii U libraries
        run: dkp-pacman -S --noconfirm --needed wut wut-tools wiiu-sdl2 wiiu-pkg-config wiiu-curl wiiu-mbedtls

      # The version comes from the tag (platform/pc/Makefile drops "wiiu-").
      - name: Build Wii U Port (Release)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          make -C platform/pc OS_TARGET=wiiu -j$(nproc) CHANNEL=${{ needs.vars.outputs.prerelease == 'true' && 'beta' || 'release' }}
          cp platform/pc/mzm-wiiu.wuhb "mzm-wiiu-${{ needs.vars.outputs.tag }}.wuhb"

      - name: Upload the WUHB
        uses: actions/upload-artifact@v4
        with:
          name: mzm-wiiu
          path: mzm-wiiu-${{ needs.vars.outputs.tag }}.wuhb

  release:
    needs: [vars, build-3ds, build-wiiu]
    # Runs when the builds this tag asked for succeeded (a skipped one is fine).
    if: >-
      always() && needs.vars.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes: QR code for the CIA (scannable with Universal-Updater / phone),
      # the hand-written notes and a changelog of every commit since the previous tag.
      - name: Generate the release page
        env:
          TAG: ${{ needs.vars.outputs.tag }}
          PRERELEASE: ${{ needs.vars.outputs.prerelease }}
          B3DS: ${{ needs.vars.outputs.build_3ds }}
          BWIIU: ${{ needs.vars.outputs.build_wiiu }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"
          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Beta build.** This comes off a \`release/*\` branch that has not"
              echo "> been merged into \`main\` yet, so it is not a stable version."
              echo
            fi
            # Player-facing notes, written by hand per release in
            # docs/release-notes/<tag>.md. The consoles' updaters read the
            # block between the two markers (port_updater_parse.c,
            # Updater_CollectNotes); keep the markers exactly as they are.
            NOTES_FILE="docs/release-notes/${TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              echo "<!-- mzm-notes -->"
              echo "## What's new"
              echo
              cat "$NOTES_FILE"
              echo
              echo "<!-- /mzm-notes -->"
              echo
            else
              echo "::warning file=${NOTES_FILE}::no release notes for ${TAG}; the in-game What's New will say so"
            fi
            echo "## Downloads"
            echo
            if [ "$B3DS" = "true" ]; then
              echo "### 3DS"
              echo
              echo "![QR code for the ${TAG} CIA](${BASE}/QR-${TAG}.png)"
              echo
              echo "- [mzm-3ds-${TAG}.cia](${BASE}/mzm-3ds-${TAG}.cia)"
              echo
              echo "Install the CIA. No \`.3dsx\` is published: a 3dsx cannot"
              echo "declare its own memory budget, so it inherits whatever the"
              echo "Homebrew Launcher host has left -- not enough for the 8MB"
              echo "ROM buffer plus the GPU buffers this port reserves. The CIA"
              echo "asks for 64MB of its own (see cia/mzm3ds.rsf)."
              echo
            fi
            if [ "$BWIIU" = "true" ]; then
              echo "### Wii U"
              echo
              echo "- [mzm-wiiu-${TAG}.wuhb](${BASE}/mzm-wiiu-${TAG}.wuhb)"
              echo
              echo "Copy it to \`sd:/wiiu/apps/mzm/mzm-wiiu.wuhb\` (Aroma), next to the ROM"
              echo "(\`mzm_eu.gba\`). Later versions update themselves from the game."
              echo
            fi
            echo "## Changelog"
            echo
            git log ${RANGE} --no-merges --pretty='- %s (%h)'
          } > release_notes.md
          if [ "$B3DS" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq qrencode > /dev/null
            qrencode -s 10 -o "dist/QR-${TAG}.png" "${BASE}/mzm-3ds-${TAG}.cia"
          fi
          ls -l dist

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.vars.outputs.tag }}
          name: ${{ needs.vars.outputs.channel }} ${{ needs.vars.outputs.version }} (${{ needs.vars.outputs.platforms }})
          draft: false
          prerelease: ${{ needs.vars.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: release_notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Announce the release on Discord (Tinaut's 3DS Ports server). A stable goes to
      # #announcements and pings the project's role; a beta goes to #beta-testing
      # without a ping. The webhook URLs live in the repo secrets DISCORD_WEBHOOK_RELEASE
      # and DISCORD_WEBHOOK_BETA: without them this step does nothing, and a Discord
      # error never fails the release. Re-running the workflow posts again.
      - name: Announce on Discord
        continue-on-error: true
        env:
          WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          PROJECT: "Metroid: Zero Mission"
          ROLE_ID: "1570479931916550185"
          TAG: ${{ needs.vars.outputs.tag }}
          VERSION: ${{ needs.vars.outputs.version }}
          PLATFORMS: ${{ needs.vars.outputs.platforms }}
          CHANNEL: ${{ needs.vars.outputs.channel }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHANNEL" = "Release" ]; then HOOK="$WEBHOOK_RELEASE"; else HOOK="$WEBHOOK_BETA"; fi
          if [ -z "$HOOK" ]; then echo "No Discord webhook secret for the $CHANNEL channel: not announcing"; exit 0; fi
          URL="https://github.com/$REPO/releases/tag/$TAG"
          NOTES="docs/release-notes/${TAG}.md"
          DESC="Download it from the release page."
          if [ -f "$NOTES" ]; then
            DESC=$(head -c 3500 "$NOTES")
            [ "$(wc -c < "$NOTES")" -gt 3500 ] && DESC="$DESC"$'\n\n'"... (full notes on the release page)"
          fi
          if [ "$CHANNEL" = "Release" ]; then
            CONTENT="<@&$ROLE_ID> **$PROJECT $VERSION** ($PLATFORMS) is out!"; ROLES="[\"$ROLE_ID\"]"
            TITLE="$PROJECT $VERSION ($PLATFORMS)"; COLOR=5763719
          else
            CONTENT="**$PROJECT $VERSION** ($PLATFORMS) beta is ready for testing."; ROLES="[]"
            TITLE="$PROJECT $VERSION ($PLATFORMS, beta)"; COLOR=16705372
          fi
          jq -n --arg content "$CONTENT" --arg title "$TITLE" --arg url "$URL" --arg desc "$DESC" \
                --argjson color "$COLOR" --argjson roles "$ROLES" \
            '{content: $content, allowed_mentions: {parse: [], roles: $roles},
              embeds: [{title: $title, url: $url, description: $desc, color: $color}]}' > discord.json
          curl -fsS -H "Content-Type: application/json" -d @discord.json "$HOOK"
